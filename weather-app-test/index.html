<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Forecast</h1>
            <p class="subtitle">Enter a city name to get the current weather and 5-day forecast</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="cityInput" 
                    class="search-input" 
                    placeholder="Enter city name..." 
                    aria-label="City search input">
                <button id="searchBtn" class="search-btn" aria-label="Search for city">Search</button>
                <button id="geoBtn" class="geo-btn" title="Use my location" aria-label="Get weather for current location">📍</button>
            </div>
            
            <!-- Favorites Dropdown -->
            <div class="favorites-section">
                <div class="favorites-dropdown">
                    <button id="favoritesToggle" class="favorites-toggle" aria-label="Toggle favorites list" aria-expanded="false">
                        ⭐ Favorites
                    </button>
                    <div id="favoritesList" class="favorites-list" role="menu">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
            
            <!-- Temperature Unit Toggle -->
            <div class="unit-toggle">
                <label for="unitSelect" class="unit-label">Temperature:</label>
                <select id="unitSelect" class="unit-select" aria-label="Temperature unit selector">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                </select>
            </div>
        </div>

        <!-- Error Message Display -->
        <div id="errorContainer" class="error-container" role="alert" aria-live="polite"></div>

        <!-- Loading Indicator -->
        <div id="loadingContainer" class="loading-container" aria-live="polite" aria-label="Loading indicator">
            <p id="loadingText" class="loading-text"></p>
        </div>

        <!-- Current Weather Section -->
        <div id="currentWeatherContainer" class="current-weather-container">
            <div id="currentWeather" class="current-weather">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Forecast View Toggle -->
        <div id="forecastToggleContainer" class="forecast-toggle-container" style="display: none;">
            <button id="fiveDayToggle" class="forecast-toggle active" aria-pressed="true">5-Day Forecast</button>
            <button id="hourlyToggle" class="forecast-toggle" aria-pressed="false">24-Hour Forecast</button>
        </div>

        <!-- 5-Day Forecast Section -->
        <div id="forecastContainer" class="forecast-container">
            <h2>5-Day Forecast</h2>
            <div id="forecastGrid" class="forecast-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- 24-Hour Forecast Section -->
        <div id="hourlyContainer" class="hourly-container">
            <h2>24-Hour Forecast</h2>
            <div id="hourlyGrid" class="hourly-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Last Search Info -->
        <footer class="footer">
            <p id="lastSearchInfo" class="last-search-info"></p>
        </footer>
    </div>

    <!-- 
        IMPORTANT: API Key Setup
        1. Sign up for free at: https://www.weatherapi.com/
        2. Copy your API key from the dashboard
        3. Replace 'YOUR_API_KEY' in script.js with your actual key
    -->

    <script src="script.js"></script>
</body>
</html>
